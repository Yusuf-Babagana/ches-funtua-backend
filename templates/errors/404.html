{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; background:var(--slate-50);">
    <div class="card" style="max-width:28rem; text-align:center;">
        <div class="card-body" style="padding:3rem 2rem;">
            <div style="font-size:2.5rem; font-weight:800; color:var(--slate-300); margin-bottom:0.5rem;">404</div>
            <h2 style="font-size:1.15rem; color:var(--slate-900); margin-bottom:0.5rem;">Page not found</h2>
            <p class="text-muted text-sm">The page you're looking for doesn't exist or may have moved.</p>
            <div style="margin-top:1.75rem;">
                <a href="{% url 'portal:landing' %}" class="btn btn-primary">Back to home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
