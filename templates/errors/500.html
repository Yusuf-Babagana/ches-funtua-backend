<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong · CHES Funtua</title>
    <!-- Deliberately self-contained (no {% static %}/{% url %} beyond the
         basics, no extends) so this page still renders even if the error
         that triggered it was in static-file config or the URL layer. -->
    <style>
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            background:#f8fafc; color:#0f172a; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .card { max-width:28rem; text-align:center; background:#fff; border:1px solid #e2e8f0; border-radius:1rem;
            padding:3rem 2rem; box-shadow:0 1px 3px rgb(15 23 42 / 0.08); }
        .code { font-size:2.5rem; font-weight:800; color:#dc2626; margin-bottom:0.5rem; }
        h2 { font-size:1.15rem; margin:0 0 0.5rem; }
        p { color:#64748b; font-size:0.875rem; margin:0; }
        a { display:inline-block; margin-top:1.75rem; background:#0f766e; color:#fff; text-decoration:none;
            font-weight:600; font-size:0.875rem; padding:0.65rem 1.25rem; border-radius:0.625rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">500</div>
        <h2>Something went wrong</h2>
        <p>An unexpected error occurred. It's been noted — please try again shortly.</p>
        <a href="/">Back to home</a>
    </div>
</body>
</html>
